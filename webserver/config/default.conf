server {
    listen 8080;
    listen 8081;
    server_name localhost;
    client_max_body_size 1048576;

    error_page 404 ./www/errors/404.html;

    location / {
        root ./www;
        index index.html;
        methods GET;
        autoindex off;
    }

    location /images {
        root ./www/images;
        methods GET;
        autoindex on;
    }

    location /uploads {
        root ./www/uploads;
        methods GET POST DELETE;
        upload_enabled on;
        upload_dir ./www/uploads;
        autoindex on;
    }

    location /old {
        redirect 301 /index.html;
    }

    location /cgi-bin {
        root ./www/cgi-bin;
        methods GET POST;
        cgi_ext .sh /bin/bash;
        cgi_ext .py /usr/bin/python3;
    }
}

server {
    listen 9090;
    server_name segundo;
    client_max_body_size 524288;

    error_page 404 ./www2/404.html;

    location / {
        root ./www2;
        index home.html;
        methods GET;
        autoindex off;
    }
}