		client_max_body_size 100;
    }

    location /directory {
        methods POST GET;
        root ./YoupiBanane;
        index youpi.bad_extension;
		cgi_ext .bla /home/gfischba/Desktop/webserv/webserver/cgi_tester;
    }
}