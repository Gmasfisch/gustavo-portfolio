server {
    listen 8080;
    server_name localhost;
	client_max_body_size 105000000;

    location / {
        methods GET;
        root ./YoupiBanane;
        index youpi.bad_extension;
    }

    location /put_test {
        methods POST;
        root ./YoupiBanane/put_here;
		upload_enabled on;
		upload_dir ./YoupiBanane/put_here;
    }

    location /post_body {
